services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-init:
    image: apache/kafka:3.8.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "/opt/kafka/bin/kafka-topics.sh --create --if-not-exists
      --topic evenements_web --partitions 3 --replication-factor 1
      --bootstrap-server kafka:19092 &&
      /opt/kafka/bin/kafka-topics.sh --describe --topic evenements_web
      --bootstrap-server kafka:19092"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092

  producteur:
    build: .
    image: producteur-kafka
    profiles: ["producteur"]
    container_name: producteur
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
    volumes:
      - ./echantillon:/donnees:ro
    restart: "no"
    command: ["--fichier", "/donnees/sample_200k.csv", "--mode", "rejeu", "--vitesse", "600", "--limite", "200000"]


  
  
  hdfs-permissions:
    image: apache/hadoop:3.5.0
    container_name: hdfs-permissions
    user: "0:0"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - "mkdir -p /hadoop/dfs/name /hadoop/dfs/data && chown -R 1001:100 /hadoop/dfs/name /hadoop/dfs/data"
    volumes:
      - hdfs-namenode-data:/hadoop/dfs/name
      - hdfs-datanode-data:/hadoop/dfs/data
    restart: "no"

  namenode:
    image: apache/hadoop:3.5.0
    container_name: namenode
    depends_on:
      hdfs-permissions:
        condition: service_completed_successfully
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - ./hadoop/config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - hdfs-namenode-data:/hadoop/dfs/name
    command:
      - /bin/bash
      - -c
      - |
        if [ ! -f /hadoop/dfs/name/current/VERSION ]; then
          echo "Premier démarrage : formatage du NameNode"
          /opt/hadoop/bin/hdfs namenode -format -nonInteractive
        fi
        echo "Démarrage du NameNode"
        exec /opt/hadoop/bin/hdfs namenode
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/hadoop/bin/hdfs dfsadmin -report >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  datanode:
    image: apache/hadoop:3.5.0
    container_name: datanode
    depends_on:
      hdfs-permissions:
        condition: service_completed_successfully
      namenode:
        condition: service_healthy
    environment:
      WAITFOR: namenode:9000
      WAITFOR_TIMEOUT: 120
    ports:
      - "9864:9864"
    volumes:
      - ./hadoop/config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - hdfs-datanode-data:/hadoop/dfs/data
    command: ["/opt/hadoop/bin/hdfs", "datanode"]
    restart: unless-stopped


  consumer-hdfs:
    build:
      context: ./consumer
      dockerfile: Dockerfile
    image: consumer-hdfs
    container_name: consumer-hdfs
    profiles: ["consumer"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      namenode:
        condition: service_healthy
      datanode:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      KAFKA_TOPIC: evenements_web
      KAFKA_GROUP_ID: hdfs-bronze-consumer
      HDFS_URL: http://namenode:9870
      HDFS_USER: hadoop
      BATCH_SIZE: "1000"
      BATCH_TIMEOUT: "10"
      AUTO_OFFSET_RESET: earliest
    restart: unless-stopped



volumes:
  kafka-data:
  hdfs-namenode-data:
  hdfs-datanode-data:
